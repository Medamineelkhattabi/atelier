[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pae"
version = "0.1.0"
description = "Atelier: a local-first workshop where a team of AI agents (Claude Code, Gemini CLI, Codex, Copilot and any ACP agent) works on your projects, under your rules"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1",
    "mcp>=1.10",
    "cryptography>=42",
    "jsonschema>=4.22",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "playwright==1.64.1"]

[project.scripts]
pae = "pae.cli:main"

[tool.setuptools.packages.find]
include = ["pae*"]

[tool.setuptools.package-data]
pae = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
